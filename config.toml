baseURL = "https://yenupam.com/"
languageCode = "en-us"
title = "yenupam"
theme = "not-much"
copyright = "© {year}"
[markup]
  [markup.highlight]
    style = 'dracula'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
[params]
  theme = "light"
  palette = "default"
  showThemeNotice = false
  showPostsSummary = true
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[menu]
  [[menu.main]]
    identifier = "home"
    name = "home"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    url = "/posts"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about"
    weight = 3
  [[menu.main]]
    identifier = "tags"
    name = "tags"
    url = "/tags"
    weight = 4
  [[menu.main]]
    identifier = "links"
    name = "links"
    url = "/links"
    weight = 5
